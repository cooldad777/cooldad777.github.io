<body>

<header class="hero plain">
  <h1>Chronicle</h1>
  <p class="sub">Timestamped public timeline of AI learning. Append-only. What moved, and what is still open.</p>
</header>
<section class="unit gray" id="list"><p class="sub">Loading the trail…</p></section>
<footer><div class="foot"><div class="foot-links">
  <a href="../index.html">SEE, R</a>
  <a href="../seersolutions/index.html">SEER Solutions</a>
  <a href="mailto:ryanrsee@gmail.com">ryanrsee@gmail.com</a>
</div><p>Copyright © 2026 SEE, R. Kennesaw, Georgia.</p></div></footer>
<script>
document.getElementById('menu').onclick=function(){document.getElementById('nav-links').classList.toggle('open');};
var root=document.getElementById('list');
function card(e){
  var d=document.createElement('article'); d.className='stamp';
  var models=(e.models||[]).join(', ');
  var body=e.moved||e.why||'';
  var mystery=e.mystery?('<p><strong>Still open:</strong> '+e.mystery+'</p>'):'';
  d.innerHTML='<div class="when">'+(e.timestamp||'')+(models?' · '+models:'')+'</div><h3>'+(e.what||e.id)+'</h3><p>'+body+'</p>'+mystery;
  return d;
}
fetch('entries.jsonl',{cache:'no-store'}).then(function(r){
  if(!r.ok) throw new Error('missing');
  return r.text();
}).then(function(t){
  var list=t.split(/\n/).map(function(l){l=l.trim(); if(!l) return null; try{return JSON.parse(l);}catch(e){return null;}}).filter(Boolean);
  list.sort(function(a,b){return String(b.timestamp||'').localeCompare(String(a.timestamp||''));});
  root.innerHTML='';
  if(!list.length){root.innerHTML='<p class="sub">No stamps yet.</p>'; return;}
  list.forEach(function(e){root.appendChild(card(e));});
}).catch(function(){root.innerHTML='<p class="sub">The trail file could not load. Try a hard refresh.</p>';});
</script>
</body>
</html>

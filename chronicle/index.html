<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Seer Chronicle | SEE, R</title><link rel="icon" href="../assets/favicon.png"/><link rel="stylesheet" href="../assets/apple.css"/></head><body>
<nav class="nav"><div class="nav-in"><a class="brand" href="../index.html"><img src="../assets/star.png" alt=""/>SEE, R</a><button id="menu">☰</button><div class="nav-links" id="nav-links"><a href="index.html">Chronicle</a><a href="../convergence/index.html">Convergence</a></div></div></nav>
<header class="hero plain"><h1>Chronicle</h1><p class="sub">A dated public log of how the thinking moved — including what is still unfinished.</p></header>
<section class="unit gray" id="list"><p class="sub">Loading the trail…</p></section>
<footer><div class="foot"><p><a href="../index.html">SEE, R</a></p></div></footer>
<script>
document.getElementById('menu').onclick=function(){document.getElementById('nav-links').classList.toggle('open');};
const root=document.getElementById('list');
function card(e){
  const d=document.createElement('article'); d.className='stamp';
  d.innerHTML='<div class="when">'+(e.timestamp||'')+' · '+((e.models||[]).join(', '))+'</div><h3>'+(e.what||e.id)+'</h3><p>'+(e.moved||e.why||'')+'</p>';
  return d;
}
fetch('entries.jsonl').then(function(r){return r.text();}).then(function(t){
  const list=t.split(/\n/).map(function(l){l=l.trim();if(!l)return null;try{return JSON.parse(l);}catch(e){return null;}}).filter(Boolean);
  list.sort(function(a,b){return String(b.timestamp).localeCompare(String(a.timestamp));});
  root.innerHTML=''; list.forEach(function(e){root.appendChild(card(e));});
}).catch(function(){root.innerHTML='<p class="sub">The trail file could not load.</p>';});
</script>
</body></html>

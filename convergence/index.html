<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Convergence | SEE, R</title>
<link rel="icon" href="../assets/favicon.png"/>
<link rel="stylesheet" href="../assets/apple.css"/>
<style>
  body{background:#f5f5f7}
  .hero{--hero-img:url('../assets/forest.jpg');min-height:36vh;padding:96px 22px 28px}
  .hero img.spin{height:44px;margin:0 auto 8px;display:block;animation:spin 18s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .stage{max-width:980px;margin:0 auto;padding:12px 16px 80px}
  .famrow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
  .fam{border:0;background:#fff;border-radius:14px;padding:12px 14px;min-height:52px;min-width:140px;flex:1 1 140px;text-align:left;cursor:pointer;font:inherit;color:#1d1d1f}
  .fam b{display:block;font-size:14px}
  .fam span{display:block;font-size:11px;color:#6e6e73;margin-top:2px}
  .fam.on{background:#1d1d1f;color:#fff}
  .fam.on span{color:#a1a1a6}
  .board{background:#fff;border-radius:22px;padding:28px 24px 32px;animation:rise .55s cubic-bezier(.22,1,.36,1)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#6e6e73}
  .board h2{font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;margin:6px 0 8px}
  .pop,.more{font-size:15px;color:#3a3a3c;line-height:1.5}
  .quote{margin:16px 0;padding:18px 20px;background:#f5f5f7;border-radius:14px;font-size:19px;line-height:1.45}
  .quote cite{display:block;margin-top:10px;font-size:12px;font-style:normal;color:#6e6e73}
  .split{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:8px 0;background:#eee}
  .split b{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:#6e6e73;margin-bottom:16px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:800px){.cols{grid-template-columns:1fr}}
  .twigs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .twigs button{border:0;background:#f5f5f7;border-radius:980px;padding:10px 14px;min-height:44px;font:600 13px -apple-system,sans-serif;cursor:pointer}
  .twigs button.on{background:#1d1d1f;color:#fff}
  .flow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .flow .step{flex:1 1 140px;background:#f5f5f7;border-radius:14px;padding:12px}
  .flow .step em{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6e6e73;font-style:normal}
  .news{margin-top:22px;padding:18px;background:#f5f5f7;border-radius:16px}
  .news h3{margin:0 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6e6e73}
  .news .read{font-size:15px;margin:8px 0}
</style></head>
<body>
<nav class="nav"><div class="nav-in">
  <a class="brand" href="../index.html"><img src="../assets/star.png" alt=""/>SEE, R</a>
  <button id="menu" type="button">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="../grounded/index.html">GROUNDED</a>
    <a href="index.html">Convergence</a>
  </div>
</div></nav>
<header class="hero">
  <img class="spin" src="../assets/star.png" alt=""/>
  <h1>The Convergence</h1>
  <p class="sub">One map. Their own words.</p>
</header>
<div class="stage">
  <div class="famrow" id="famrow"></div>
  <div id="board"></div>
</div>
<footer><div class="foot"><p>SEE, R · Kennesaw, Georgia</p></div></footer>
<script src="xian.js"></script>
<script src="xian-patch.js"></script>
<script src="islam.js"></script>
<script src="rest.js"></script>
<script src="rest-patch.js"></script>
<script src="flow.js"></script>
<script src="news.js"></script>
<script src="data.js"></script>
<script>
(function(){
  const row=document.getElementById('famrow'), board=document.getElementById('board');
  const data=(window.CONV||[]);
  let on=data[0]||null, twig=null;
  function tiles(){
    row.innerHTML='';
    data.forEach(function(x){
      const b=document.createElement('button'); b.type='button';
      b.className='fam'+(on&&on.id===x.id?' on':'');
      b.innerHTML='<b>'+x.name+'</b><span>'+x.short+'</span>';
      b.addEventListener('click', function(e){ e.preventDefault(); on=x; twig=null; draw(); });
      row.appendChild(b);
    });
  }
  function q(obj){ return obj?('<blockquote class="quote">“'+obj.t+'”<cite>'+obj.s+'</cite></blockquote>'):''; }
  function draw(){
    tiles();
    if(!on){ board.innerHTML='<div class="board"><p>Could not load the map.</p></div>'; return; }
    const wrap=document.createElement('div'); wrap.className='board';
    var h='<p class="kicker">Family</p><h2>'+on.name+'</h2><p class="pop">'+on.pop+'</p><p class="more">'+on.what+'</p>'+q(on.quote);
    if(on.parts){
      h+='<p class="kicker">Next split</p><div class="split">';
      on.parts.forEach(function(p){ h+='<b style="width:'+p.w+'%;background:'+p.c+'"></b>'; });
      h+='</div><div class="legend">';
      on.parts.forEach(function(p){ h+='<span>'+p.n+' · '+p.l+'</span> '; });
      h+='</div>';
    }
    h+='<div class="cols"><div><h3 class="kicker">Edge of history</h3><p class="more">'+on.end+'</p>'+q(on.qEnd)+'</div>';
    h+='<div><h3 class="kicker">Unrestrained power</h3><p class="more">'+on.power+'</p>'+q(on.qPow)+'</div></div>';
    h+='<p class="kicker">Where the new tools rhyme</p><p class="more">'+on.tech+'</p>';
    h+='<p class="kicker">What this lens expects next</p><div class="flow"></div><div class="news" id="newsbox"></div>';
    if(on.twigs) h+='<p class="kicker">'+(on.twigLabel||'Third grain')+'</p><div class="twigs"></div><p class="more twigread"></p>';
    wrap.innerHTML=h; board.innerHTML=''; board.appendChild(wrap);
    var steps=(twig&&twig.flow)||(window.TWIGFLOWS&&twig&&TWIGFLOWS[twig.n])||on.flow||(window.FLOWS&&FLOWS[on.id])||[];
    var fl=wrap.querySelector('.flow');
    steps.forEach(function(s,i){ var d=document.createElement('div'); d.className='step'; d.innerHTML='<em>'+(i?'then':'start')+'</em><b>'+s.n+'</b><p>'+s.d+'</p>'; fl.appendChild(d); });
    var nb=wrap.querySelector('#newsbox');
    if(nb&&window.NEWS_STORY){
      var st=NEWS_STORY, rd=(NEWS_READ&&NEWS_READ[on.id])||null;
      var html='<h3>This month\'s rhyme · as of '+(NEWS_ASOF||'')+'</h3>';
      html+='<p class="story"><b>'+st.title+'.</b> '+st.what+' <a href="'+st.href+'" target="_blank" rel="noopener">Source</a></p>';
      if(rd){ html+='<p class="read">'+rd.g1+'</p><p class="read">'+rd.g2+'</p><p class="read">'+(twig?('<b>'+twig.n+'.</b> '):'')+rd.g3+'</p>'; }
      html+='<ul class="livehead"></ul>'; nb.innerHTML=html;
      if(window.fetchNewsHeadlines) fetchNewsHeadlines().then(function(items){
        var ul=nb.querySelector('.livehead'); if(!ul) return;
        items.forEach(function(it){ var li=document.createElement('li'); li.innerHTML='<a href="'+it.href+'" target="_blank" rel="noopener">'+it.title+'</a>'; ul.appendChild(li); });
      });
    }
    if(on.twigs){
      var box=wrap.querySelector('.twigs'), rec=wrap.querySelector('.twigread');
      on.twigs.forEach(function(t){
        var b=document.createElement('button'); b.type='button'; b.textContent=t.n;
        if(twig&&twig.n===t.n) b.className='on';
        b.addEventListener('click', function(e){ e.preventDefault(); twig=t; draw(); });
        box.appendChild(b);
      });
      if(twig) rec.innerHTML='<b>'+twig.n+'.</b> '+twig.w+(twig.q?q(twig.q):'');
    }
  }
  draw();
  var m=document.getElementById('menu'), n=document.getElementById('nav-links');
  if(m) m.addEventListener('click', function(){ n.classList.toggle('open'); });
})();
</script>
</body></html>

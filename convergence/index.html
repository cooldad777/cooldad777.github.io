<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Convergence | SEE, R</title>
<link rel="icon" href="../assets/favicon.png"/>
<link rel="stylesheet" href="../assets/apple.css"/>
<style>
  body{background:#f5f5f7}
  .hero{--hero-img:url('../assets/forest.jpg');min-height:36vh;padding:96px 22px 28px}
  .hero img.spin{height:44px;margin:0 auto 8px;display:block;animation:spin 18s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .stage{max-width:980px;margin:0 auto;padding:12px 16px 80px}
  .famrow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
  .fam{border:0;background:#fff;border-radius:14px;padding:12px 14px;min-height:52px;min-width:140px;flex:1 1 140px;text-align:left;cursor:pointer;font:inherit;color:#1d1d1f;-webkit-tap-highlight-color:transparent}
  .fam b{display:block;font-size:14px}
  .fam span{display:block;font-size:11px;color:#6e6e73;margin-top:2px}
  .fam.on{background:#1d1d1f;color:#fff}
  .fam.on span{color:#a1a1a6}
  .board{background:#fff;border-radius:22px;padding:28px 24px 32px;animation:rise .55s cubic-bezier(.22,1,.36,1)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#6e6e73}
  .board h2{font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;margin:6px 0 8px}
  .pop{font-size:15px;color:#6e6e73;margin-bottom:12px}
  .quote{margin:16px 0;padding:18px 20px;background:#f5f5f7;border-radius:14px;font-size:19px;line-height:1.45}
  .quote cite{display:block;margin-top:10px;font-size:12px;font-style:normal;color:#6e6e73}
  .split{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:8px 0 8px;background:#eee}
  .split b{display:block;height:100%;transform-origin:left;animation:grow .8s cubic-bezier(.22,1,.36,1)}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:#6e6e73;margin-bottom:16px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:800px){.cols{grid-template-columns:1fr}}
  .cols h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6e6e73;margin-bottom:8px}
  .cols p{font-size:16px;color:#3a3a3c;margin:0 0 10px}
  .twigs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .twigs button{border:0;background:#f5f5f7;border-radius:980px;padding:10px 14px;min-height:44px;font:600 13px -apple-system,sans-serif;cursor:pointer}
  .twigs button.on{background:#1d1d1f;color:#fff}
  .more{margin-top:14px;font-size:16px;color:#3a3a3c}
</style>
</head>
<body>
<nav class="nav"><div class="nav-in">
  <a class="brand" href="../index.html"><img src="../assets/star.png" alt=""/>SEE, R</a>
  <button id="menu" type="button">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="../grounded/index.html">GROUNDED</a>
    <a href="index.html">Convergence</a>
  </div>
</div></nav>
<header class="hero">
  <img class="spin" src="../assets/star.png" alt=""/>
  <h1>The Convergence</h1>
  <p class="sub">One map. Their own words.</p>
</header>
<div class="stage">
  <div class="famrow" id="famrow"></div>
  <div id="board"></div>
</div>
<footer><div class="foot"><p>SEE, R · Kennesaw, Georgia</p></div></footer>
<script src="data.js"></script>
<script>
(function(){
  const row=document.getElementById('famrow');
  const board=document.getElementById('board');
  const data=(window.CONV||[]);
  let on=data[0]||null, twig=null;
  function tiles(){
    row.innerHTML='';
    data.forEach(function(x){
      const b=document.createElement('button');
      b.type='button';
      b.className='fam'+(on&&on.id===x.id?' on':'');
      b.innerHTML='<b>'+x.name+'</b><span>'+x.short+'</span>';
      b.addEventListener('click', function(e){ e.preventDefault(); on=x; twig=null; draw(); });
      row.appendChild(b);
    });
  }
  function q(obj){ if(!obj) return ''; return '<blockquote class="quote">“'+obj.t+'”<cite>'+obj.s+'</cite></blockquote>'; }
  function draw(){
    tiles();
    if(!on){ board.innerHTML='<div class="board"><p class="more">Could not load the map.</p></div>'; return; }
    const wrap=document.createElement('div');
    wrap.className='board';
    var h='<p class="kicker">Family</p><h2>'+on.name+'</h2><p class="pop">'+on.pop+'</p>';
    h+='<p class="more">'+on.what+'</p>'+q(on.quote);
    if(on.parts&&on.parts.length){
      h+='<p class="kicker">Next split</p><div class="split">';
      on.parts.forEach(function(p){ h+='<b style="width:'+p.w+'%;background:'+p.c+'"></b>'; });
      h+='</div><div class="legend">';
      on.parts.forEach(function(p){ h+='<span><i style="background:'+p.c+'"></i>'+p.n+' · '+p.l+'</span>'; });
      h+='</div>';
    }
    h+='<div class="cols"><div><h3>Edge of history</h3><p>'+on.end+'</p>'+q(on.qEnd)+'</div>';
    h+='<div><h3>Unrestrained power</h3><p>'+on.power+'</p>'+q(on.qPow)+'</div></div>';
    h+='<p class="kicker" style="margin-top:18px">Where machines rhyme</p><p class="more">'+on.tech+'</p>';
    if(on.twigs){ h+='<p class="kicker" style="margin-top:18px">Third grain</p><div class="twigs"></div><p class="more twigread"></p>'; }
    wrap.innerHTML=h;
    board.innerHTML='';
    board.appendChild(wrap);
    if(on.twigs){
      const box=wrap.querySelector('.twigs');
      const rec=wrap.querySelector('.twigread');
      on.twigs.forEach(function(t){
        const b=document.createElement('button');
        b.type='button'; b.textContent=t.n;
        if(twig&&twig.n===t.n) b.className='on';
        b.addEventListener('click', function(e){
          e.preventDefault();
          twig=t;
          box.querySelectorAll('button').forEach(function(x){ x.className=''; });
          b.className='on';
          rec.innerHTML='<b>'+t.n+'.</b> '+t.w+(t.q?(' “'+t.q.t+'” — '+t.q.s):'');
        });
        box.appendChild(b);
      });
    }
  }
  draw();
  const m=document.getElementById('menu'), n=document.getElementById('nav-links');
  if(m) m.addEventListener('click', function(){ n.classList.toggle('open'); });
})();
</script>
</body></html>
